<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telco NOC</title>
<style>
:root{--bg:#0B1220;--panel:#111A2E;--panel2:#16213A;--line:#23304D;--text:#E6ECF7;--mut:#8C9AB8;--dim:#5E6B88;--blue:#4C8DFF;--cyan:#27C4D8;--green:#2FBF71;--amber:#F2A93B;--red:#FF5A5F;--purple:#A78BFA;--pink:#F472B6;--white:#fff;--shadow:0 1px 2px rgba(0,0,0,.4)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
button{cursor:pointer;font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:7px 12px;background:var(--panel2);color:var(--text);transition:background .12s,border-color .12s}
button:hover{border-color:var(--blue)}button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}button.warn{background:#3A2A10;border-color:var(--amber);color:#FFD9A0}button.dng{background:#3A1418;border-color:var(--red);color:#FFC2C4}button.ok{background:#0F3322;border-color:var(--green);color:#B6F2CF}
input,select,textarea{font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#0D1526;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:7px 8px;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:7px 8px;border-bottom:1px solid #1A2640;vertical-align:top;font-size:12px}
tr.click{cursor:pointer}tr.click:hover{background:#18233D}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
#login-screen,#app{display:none}
#login-screen{align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(circle at 30% 20%,#17264A,#0B1220 60%)}
.login-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:36px;width:400px}
.login-box h1{font-size:22px;margin-bottom:4px}.login-box h1 span{color:var(--cyan)}
.login-box .sub{color:var(--mut);margin-bottom:22px;font-size:12px}
.login-box label{display:block;font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;margin:0 0 4px;letter-spacing:.4px}
.login-box input{width:100%;margin-bottom:14px}.login-box button{width:100%;padding:11px}
.login-box .error{color:var(--red);font-size:12px;margin-top:8px;display:none}
.topbar{background:#0A1020;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;height:52px;position:sticky;top:0;z-index:100;gap:10px}
.topbar .logo{font-weight:800;font-size:15px;white-space:nowrap;letter-spacing:-.2px}.topbar .logo span{color:var(--cyan)}
.topbar nav{display:flex;gap:2px;overflow-x:auto}
.topbar nav button{background:transparent;border:none;color:var(--mut);padding:7px 10px;font-weight:500;white-space:nowrap}
.topbar nav button:hover{color:#fff;background:#141E35}.topbar nav button.active{background:#1B2A4C;color:#fff;font-weight:700;box-shadow:inset 0 -2px 0 var(--cyan)}
.topbar .spacer{flex:1}
.user-info{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:8px;white-space:nowrap}.user-info strong{color:#fff}
.logout-btn{padding:4px 9px;font-size:11px}
.health-pill{font-size:11px;padding:3px 9px;border-radius:12px;border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.console{display:none;padding:16px 18px;max-width:1680px;margin:0 auto}.console.active{display:block}
.h1{font-size:19px;font-weight:700;margin-bottom:2px}.sub{color:var(--mut);font-size:12px;margin-bottom:14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g-side{grid-template-columns:2fr 1fr}.g-side2{grid-template-columns:1.25fr 1fr}
@media(max-width:1100px){.g2,.g3,.g4,.g-side,.g-side2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:12px;min-width:0}
.card h3{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;margin-bottom:10px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;border-left:3px solid var(--dim)}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.kpi .l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700}.kpi .s{font-size:11px;color:var(--mut);margin-top:2px}
.b{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.2px;white-space:nowrap;border:1px solid transparent}
.P1{background:#4A1418;color:#FF9EA1;border-color:#7A2228}.P2{background:#43300F;color:#FFCC80;border-color:#6E4E17}.P3{background:#15324F;color:#9CC8FF;border-color:#24507E}.P4{background:#1C2436;color:#AAB6CF}
.Confirmed{background:#4A1418;color:#FF9EA1}.Inferred{background:#43300F;color:#FFCC80}.Potential{background:#15324F;color:#9CC8FF}
.st-down{color:var(--red)}.st-risk{color:var(--amber)}.st-up{color:var(--green)}
.tag{background:#1A2640;color:var(--mut);border:1px solid var(--line)}.tag-g{background:#0F3322;color:#8EE6B4}.tag-r{background:#3A1418;color:#FF9EA1}.tag-a{background:#3A2A10;color:#FFD08A}.tag-b{background:#12294A;color:#9CC8FF}.tag-p{background:#2A1F4A;color:#CBB7FF}
.inc-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer;border-left:4px solid var(--dim)}
.inc-card:hover{border-color:var(--blue)}.inc-card.P1{border-left-color:var(--red);background:var(--panel2);color:var(--text)}.inc-card.P2{border-left-color:var(--amber);background:var(--panel2);color:var(--text)}.inc-card.P3{border-left-color:var(--blue);background:var(--panel2);color:var(--text)}
.inc-card .t{font-weight:700;font-size:13px;margin:4px 0}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.funnel .bar{height:26px;border-radius:6px;display:flex;align-items:center;padding:0 10px;font-weight:700;font-size:12px;margin-bottom:6px;color:#fff;white-space:nowrap;min-width:fit-content}
.q5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}@media(max-width:1300px){.q5{grid-template-columns:1fr 1fr}}
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.q .qh{font-size:10px;font-weight:800;color:var(--cyan);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}.q .big{font-size:15px;font-weight:700;margin-bottom:4px}
.fact{border-left:2px solid var(--green);padding:3px 0 3px 8px;margin:4px 0}.infer{border-left:2px dashed var(--amber);padding:3px 0 3px 8px;margin:4px 0}
.cite{font-size:10px;color:var(--blue);font-family:ui-monospace,Menlo,monospace;margin-left:4px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}.tl .it{position:relative;margin-bottom:10px}.tl .it::before{content:'';position:absolute;left:-17px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--dim)}
.tl .it.User::before{background:var(--blue)}.tl .it.Engine::before{background:var(--cyan)}.tl .it.Workflow::before{background:var(--purple)}.tl .it.AI::before{background:var(--pink)}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;flex-wrap:wrap}.tabs2 button{border:none;background:transparent;color:var(--mut);border-radius:6px 6px 0 0;padding:7px 11px}.tabs2 button.active{color:#fff;background:var(--panel2);box-shadow:inset 0 -2px 0 var(--cyan)}
.pager{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.banner{border:1px solid;border-radius:9px;padding:8px 12px;margin-bottom:10px;font-size:12px}.banner.warn{border-color:#6E4E17;background:#2A1E0B;color:#FFD08A}.banner.err{border-color:#7A2228;background:#2A0F12;color:#FF9EA1}.banner.info{border-color:#24507E;background:#0E1E36;color:#9CC8FF}
.modal{position:fixed;inset:0;background:rgba(3,7,15,.7);display:none;align-items:center;justify-content:center;z-index:300}.modal.open{display:flex}
.modal-content{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:560px;max-width:94vw;max-height:88vh;overflow:auto}
.modal-content h2{font-size:15px;margin-bottom:10px}.modal-content label{display:block;font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;margin:10px 0 4px}
.modal-content input,.modal-content select,.modal-content textarea{width:100%}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.drawer{position:fixed;top:52px;right:0;bottom:0;width:560px;max-width:96vw;background:var(--panel);border-left:1px solid var(--line);z-index:200;overflow:auto;padding:16px;display:none;box-shadow:-10px 0 30px rgba(0,0,0,.5)}.drawer.open{display:block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1B2A4C;border:1px solid var(--blue);padding:10px 16px;border-radius:9px;z-index:400;display:none;max-width:80vw}.toast.err{border-color:var(--red);background:#2A0F12}
.muted{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:11px}.right{text-align:right}.nowrap{white-space:nowrap}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px;font-size:12px}.kv div:nth-child(odd){color:var(--mut)}
.scroll{max-height:420px;overflow:auto}
.cal{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden}.cal .day{position:absolute;top:0;bottom:0;border-left:1px solid #1A2640;font-size:10px;color:var(--dim);padding:2px 4px}.cal .win{position:absolute;height:26px;border-radius:5px;font-size:11px;padding:5px 7px;overflow:hidden;white-space:nowrap;cursor:pointer;color:#fff}
.hbar{display:flex;align-items:center;gap:8px;margin:4px 0}.hbar .lb{width:150px;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hbar .tr{flex:1;background:#0D1526;border-radius:4px;height:14px;overflow:hidden}.hbar .fl{height:100%;border-radius:4px}.hbar .vv{width:70px;text-align:right;font-size:11px;font-variant-numeric:tabular-nums}
.empty{color:var(--dim);padding:18px;text-align:center}
.pulse{animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.45}}
svg text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <h1>Telco <span>NOC</span></h1>
    <div class="sub">Network operations on Kinetic Platform — sign in with your Kinetic account.</div>
    <label>Username</label><input type="text" id="login-user" autocomplete="username">
    <label>Password</label><input type="password" id="login-pass" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="pri" onclick="doLogin()">Sign in</button>
    <div class="error" id="login-error"></div>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <div class="logo">Telco<span>NOC</span></div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <span class="health-pill" id="health-pill" onclick="switchTab('cc')" title="Integration freshness">…</span>
    <select id="view-as" title="Admin only: preview a role's navigation (server still enforces your real permissions)" style="display:none" onchange="VIEW_AS=this.value;buildNav();switchTab(TABS_FOR()[0])"></select>
    <div class="user-info"><strong id="user-display"></strong><span id="tenant-display" class="b tag-b"></span><button class="logout-btn" onclick="doLogout()">Logout</button></div>
  </div>
  <div class="console" id="tab-cc"></div>
  <div class="console" id="tab-inc"></div>
  <div class="console" id="tab-map"></div>
  <div class="console" id="tab-net"></div>
  <div class="console" id="tab-cust"></div>
  <div class="console" id="tab-chg"></div>
  <div class="console" id="tab-field"></div>
  <div class="console" id="tab-exec"></div>
</div>
<div class="drawer" id="drawer"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal-content" id="modal-content"></div></div>
<div class="toast" id="toast"></div>
<script>
// ───────────────────────── shell ─────────────────────────
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,"&#39;")}
function jsArg(x){return esc(JSON.stringify(String(x==null?'':x)))}
let API={auth:'',user:'',displayName:''},ME=null,VIEW_AS='',CUR_INC=null,SEQ={};
const TABS={cc:'Command Center',inc:'Incident Workspace',map:'Impact Map',net:'Network',cust:'Customers',chg:'Change Calendar',field:'Field Queue',exec:'Executive'};
const ROLE_TABS={'Operator':['cc','inc','map','net','cust','chg','field','exec'],'Service Owner':['cc','inc','map','cust','chg','exec','net'],'Field Tech':['field','inc','map'],'Support Agent':['cust','cc'],'Executive':['exec','cc','map'],'Tenant Admin':['cc','net','cust','chg','exec']};
function roles(){return VIEW_AS?[VIEW_AS]:(ME?.roles||[])}
function TABS_FOR(){const r=roles();const s=new Set();r.forEach(x=>(ROLE_TABS[x]||[]).forEach(t=>s.add(t)));return Object.keys(TABS).filter(t=>s.has(t))}
function can(...rs){return (ME?.spaceAdmin&&!VIEW_AS)||rs.some(r=>roles().includes(r))}
async function api(path,opts={}){const r=await fetch('/api/noc'+path,{method:opts.method||'GET',headers:{'Authorization':'Basic '+API.auth,'Content-Type':'application/json'},body:opts.body?JSON.stringify(opts.body):undefined});let d={};try{d=await r.json()}catch(e){}if(!r.ok){const e=new Error(d.error||('HTTP '+r.status));e.status=r.status;e.data=d;throw e}return d}
function toast(m,err){const t=document.getElementById('toast');t.textContent=m;t.className='toast'+(err?' err':'');t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',err?7000:3500)}
function ticket(k){SEQ[k]=(SEQ[k]||0)+1;return SEQ[k]}const stale=(k,n)=>SEQ[k]!==n;
function ago(iso){if(!iso)return'—';const m=Math.round((Date.now()-Date.parse(iso))/60000);if(isNaN(m))return'—';if(m<1)return'just now';if(m<60)return m+'m ago';if(m<1440)return Math.floor(m/60)+'h '+(m%60)+'m ago';return Math.floor(m/1440)+'d ago'}
function dur(a,b){if(!a)return'—';const m=Math.round(((b?Date.parse(b):Date.now())-Date.parse(a))/60000);return m<60?m+' min':Math.floor(m/60)+'h '+(m%60)+'m'}
const fmt$=n=>'$'+Math.round(Number(n)||0).toLocaleString();const n0=n=>(Number(n)||0).toLocaleString();
function hhmm(iso){return iso?iso.slice(11,16)+'Z':'—'}
function pB(p){return `<span class="b ${esc(p)}">${esc(p)}</span>`}
function clsB(c){return `<span class="b ${esc(c)}">${esc(c)}</span>`}
function stB(s){const m={New:'tag-r',Acknowledged:'tag-a','In Progress':'tag-a',Mitigated:'tag-b',Resolved:'tag-g',Closed:'tag',Cancelled:'tag',Passed:'tag-g',Partial:'tag-a',Failed:'tag-r',Pending:'tag-b','Not Started':'tag','Service Verified':'tag-g','Network Restored':'tag-b','Verification Failed':'tag-r',Impacted:'tag-r',Fresh:'tag-g',Stale:'tag-a','Very Stale':'tag-r','Not Configured':'tag',Healthy:'tag-g',Degraded:'tag-a',Down:'tag-r',Sent:'tag-g',Approved:'tag-b','Pending Approval':'tag-a',Draft:'tag',Rejected:'tag-r',Proposed:'tag-p',Accepted:'tag-g',Superseded:'tag',Dispatched:'tag-b','En Route':'tag-b','On Site':'tag-a','Work Complete':'tag-g',Verified:'tag-g',Active:'tag-r',Cleared:'tag-g',Suppressed:'tag-p'};return `<span class="b ${m[s]||'tag'}">${esc(s||'—')}</span>`}
function modal(html){document.getElementById('modal-content').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function drawer(html){const d=document.getElementById('drawer');d.innerHTML=`<div style="display:flex;justify-content:flex-end"><button onclick="closeDrawer()">Close ✕</button></div>`+html;d.classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
function buildNav(){const n=document.getElementById('nav');n.innerHTML=TABS_FOR().map(t=>`<button data-t="${t}" onclick="switchTab('${t}')">${TABS[t]}</button>`).join('')}
function switchTab(t){if(!TABS_FOR().includes(t))t=TABS_FOR()[0];document.querySelectorAll('.console').forEach(c=>c.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));closeDrawer();try{history.replaceState(null,'','#'+t+(t==='inc'&&CUR_INC?'/'+CUR_INC:''))}catch(e){};({cc:loadCC,inc:loadInc,map:loadMap,net:loadNet,cust:loadCust,chg:loadChg,field:loadField,exec:loadExec})[t]()}
async function doLogin(){const u=document.getElementById('login-user').value.trim(),p=document.getElementById('login-pass').value;const e=document.getElementById('login-error');e.style.display='none';API.auth=btoa(u+':'+p);try{ME=await api('/me');API.user=ME.username;API.displayName=ME.displayName;try{sessionStorage.setItem('kinetic_session',JSON.stringify({url:'',auth:API.auth,user:ME.username,displayName:ME.displayName}))}catch(x){}enterApp()}catch(x){e.textContent=x.status===401?'Invalid username or password.':x.message;e.style.display='block'}}
async function enterApp(){if(!ME){try{ME=await api('/me')}catch(e){doLogout();return}}document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='block';document.getElementById('user-display').textContent=ME.displayName;document.getElementById('tenant-display').textContent=ME.tenant;
  const va=document.getElementById('view-as');if(ME.spaceAdmin){va.style.display='';va.innerHTML='<option value="">view: all (admin)</option>'+['Operator','Service Owner','Field Tech','Support Agent','Executive'].map(r=>`<option>${r}</option>`).join('')}
  buildNav();const h=(location.hash||'').slice(1).split('/');if(h[1])CUR_INC=decodeURIComponent(h[1]);switchTab(h[0]||TABS_FOR()[0]);refreshHealth();setInterval(()=>{if(document.getElementById('tab-cc').classList.contains('active'))loadCC(true)},20000)}
function doLogout(){API={auth:'',user:'',displayName:''};ME=null;try{sessionStorage.removeItem('kinetic_session')}catch(e){}document.getElementById('app').style.display='none';document.getElementById('login-screen').style.display='flex'}
async function refreshHealth(){try{const r=await api('/integrations');const bad=r.rows.filter(x=>['Stale','Very Stale'].includes(x.freshness)||['Degraded','Down'].includes(x.status));const pill=document.getElementById('health-pill');pill.textContent=bad.length?`⚠ ${bad.length} data sources degraded/stale`:'● all data sources fresh';pill.style.color=bad.length?'var(--amber)':'var(--green)';pill.title=bad.map(b=>`${b.name}: ${b.status}, ${b.freshness}${b.ageMin!=null?' ('+b.ageMin+' min)':''}`).join('\n')}catch(e){}}

// ───────────────────────── 1. Command Center ─────────────────────────
async function loadCC(silent){const el=document.getElementById('tab-cc');const n=ticket('cc');if(!silent)el.innerHTML='<div class="empty pulse">Loading command center…</div>';
  let d;try{d=await api('/command-center')}catch(e){if(!stale('cc',n))el.innerHTML=`<div class="banner err">${esc(e.message)}</div>`;return}if(stale('cc',n))return;
  const k=d.kpis,f=d.funnel;const mx=Math.max(f.raw,1);
  const bars=[['Raw events received',f.raw,'#3B4A6B'],['Normalized alarms (dedup)',f.normalized,'#2F5FA8'],['Correlated into groups',f.correlated,'#1F8FA8'],['Open incidents',f.incidents,'#C2410C']];
  const reduction=f.raw?Math.round((1-f.incidents/f.raw)*1000)/10:0;
  const staleSrc=d.integrations.filter(i=>['Stale','Very Stale'].includes(i.freshness)||['Degraded','Down'].includes(i.status));
  el.innerHTML=`<div class="h1">NOC Command Center</div><div class="sub">Tenant <b>${esc(ME.tenant)}</b> · live · refreshes every 20 s${d.correlation?` · last correlation run ${ago(d.correlation.at)}${d.correlation.result?.ms?` (${d.correlation.result.ms} ms)`:''}`:''}</div>
  ${staleSrc.length?`<div class="banner warn">⚠ Degraded or stale data sources: ${staleSrc.map(s=>`<b>${esc(s.name)}</b> (${esc(s.status)}, ${esc(s.freshness)}${s.ageMin!=null?', '+s.ageMin+' min old':''})`).join(' · ')}. Impact results that depend on them are shown with lower confidence.</div>`:''}
  <div class="kpis">
   <div class="kpi" style="border-left-color:var(--red)"><div class="l">Open incidents</div><div class="v">${k.openIncidents}</div><div class="s">${k.p1} P1 · ${k.major} major · ${k.unacked} unacknowledged</div></div>
   <div class="kpi" style="border-left-color:var(--amber)"><div class="l">Customers affected</div><div class="v">${n0(k.customersAffected)}</div><div class="s">confirmed + inferred accounts</div></div>
   <div class="kpi" style="border-left-color:var(--purple)"><div class="l">SLA exposure (open)</div><div class="v">${fmt$(k.slaExposureUsd)}</div><div class="s">credits accruing</div></div>

async function pageCust(){const n=ticket('cust');const el=document.getElementById('cust-tbl');try{const q=new URLSearchParams();if(CP.tok[CP.i])q.set('pageToken',CP.tok[CP.i]);const r=await api('/customers?'+q);if(stale('cust',n))return;CP.tok[CP.i+1]=r.nextPageToken;
  el.className='';el.innerHTML=`<table><tr><th>Account</th><th>Segment</th><th>Tier</th><th>Channel</th><th>Current status</th></tr>${r.rows.map(c=>`<tr class="click" onclick="custDetail(${jsArg(c['Account ID'])})"><td><b>${esc(c.Name)}</b>${c['Public Safety']==='Yes'?' <span class="b tag-r">⚑ public safety</span>':''}<div class="mono dim">${esc(c['Account ID'])}</div></td><td>${esc(c.Segment)}</td><td>${esc(c.Tier)}</td><td>${esc(c['Preferred Channel'])}</td><td>${c.status?`${clsB(c.status.cls)} ${stB(c.status.recovery)} <span class="mono dim">${esc(c.status.incident)}</span>`:'<span class="st-up">● no open impact</span>'}</td></tr>`).join('')}</table><div class="pager"><button ${CP.i?'':'disabled'} onclick="CP.i--;pageCust()">‹ Prev</button><button ${r.nextPageToken?'':'disabled'} onclick="CP.i++;pageCust()">Next ›</button></div>`}catch(e){el.innerHTML=`<div class="banner err">${esc(e.message)}</div>`}}
async function custDetail(id){drawer('<div class="empty pulse">Loading…</div>');try{const d=await api('/customers/'+encodeURIComponent(id));const a=d.account;
  drawer(`<div class="h1">${esc(a.Name)}</div><div class="sub">${esc(a['Account ID'])} · ${esc(a.Segment)} · ${esc(a.Tier)}${a['Public Safety']==='Yes'?' · <b style="color:var(--red)">PUBLIC SAFETY</b>':''} · view: ${esc(d.view)}</div>
  ${d.incidents.map(i=>`<div class="card"><h3>${i.state==='Ongoing'?'<span class="b tag-r">ONGOING</span>':'<span class="b tag-g">RESOLVED</span>'} <span class="mono">${esc(i.id)}</span><span class="r small">${i.lastUpdateAt?'last customer update '+esc(hhmm(i.lastUpdateAt)):''}</span></h3>
   <div class="small muted">Approved customer-facing status:</div><div style="white-space:pre-wrap;line-height:1.5;margin:4px 0 8px">${esc(i.customerStatus)}</div>
   <div class="small">${i.services.map(s=>`<span class="mono">${esc(s.id)}</span> ${clsB(s.cls)} ${stB(s.recovery)}`).join('<br>')}</div>
   ${i.internal?`<div class="banner info" style="margin-top:8px">Internal: ${pB(i.internal.priority)} ${esc(i.internal.title)} · root <span class="mono">${esc(i.internal.root)}</span> · ${esc(i.internal.observedCause?'confirmed: '+i.internal.observedCause:'probable: '+i.internal.probableCause)} · SLA exposure ${fmt$(i.internal.sla)}${i.internal.breachAt?' · breach at '+esc(hhmm(i.internal.breachAt)):''}</div>`:''}</div>`).join('')||'<div class="card empty">No incidents affecting this account.</div>'}
  <div class="card"><h3>Services & SLAs</h3><table><tr><th>Service</th><th>SLA</th><th class="num">MRC</th><th>Contract</th></tr>${d.services.map(s=>`<tr><td>${esc(s.service?.Name||s['Service Instance ID'])}<div class="mono dim">${esc(s['Service Instance ID'])}</div></td><td>${esc(s.sla?.Name||s['SLA ID'])}</td><td class="num">${fmt$(s['Monthly Recurring Charge'])}</td><td class="small">${esc(s['Contract ID'])} → ${esc(s['Contract End'])}</td></tr>`).join('')}</table></div>
  <div class="card"><h3>Contacts <span class="r small muted">PII — access audited</span></h3>${d.contacts.map(c=>`<div class="small">${esc(c.Name)} · ${esc(c.Role)} · ${esc(c.Email)} · ${esc(c.Phone)} · prefers ${esc(c['Preferred Channel'])} (${esc(c['Notify On'])})</div>`).join('')||'<div class="dim small">No contacts (or not permitted).</div>'}</div>`)}catch(e){drawer(`<div class="banner err">${esc(e.message)}</div>`)}}

// ───────────────────────── 6. Change calendar ─────────────────────────
async function loadChg(){const el=document.getElementById('tab-chg');const n=ticket('chg');el.innerHTML='<div class="empty pulse">Loading…</div>';try{const d=await api('/changes');if(stale('chg',n))return;
  const now=Date.parse(d.now),start=now-2*86400000,end=now+10*86400000,W=100;const x=t=>Math.max(0,Math.min(100,(Date.parse(t)-start)/(end-start)*100));
  const col={'In Progress':'#C2410C',Scheduled:'#2F5FA8',Approved:'#1F8FA8',Completed:'#3B4A6B',Assessing:'#6E4FB0',Draft:'#3B4A6B'};
  const vis=d.rows.filter(c=>Date.parse(c['Window End'])>=start&&Date.parse(c['Window Start'])<=end);
  el.innerHTML=`<div class="h1">Change Calendar</div><div class="sub">Maintenance windows, alarm suppression scope and topology-based risk review. Now = ${esc(d.now)}.</div>
  <div class="card"><div class="cal" style="height:${vis.length*32+30}px">${Array.from({length:12},(_,k)=>`<div class="day" style="left:${k/12*100}%">${new Date(start+k*86400000).toISOString().slice(5,10)}</div>`).join('')}<div style="position:absolute;left:${x(d.now)}%;top:0;bottom:0;border-left:2px solid var(--red)"></div>
   ${vis.map((c,i)=>`<div class="win" title="${esc(c.Title)}" style="top:${24+i*32}px;left:${x(c['Window Start'])}%;width:max(${x(c['Window End'])-x(c['Window Start'])}%,90px);background:${col[c.State]||'#3B4A6B'}" onclick="chgRisk(${jsArg(c['Change ID'])})">${esc(c['Change ID'])} ${esc(c.Title)}</div>`).join('')}</div></div>
  <div class="card"><table><tr><th>Change</th><th>State</th><th>Window (UTC)</th><th>Scope</th><th>Suppress</th><th>Risk</th><th></th></tr>${d.rows.sort((a,b)=>(a['Window Start']||'').localeCompare(b['Window Start']||'')).map(c=>`<tr><td><span class="mono">${esc(c['Change ID'])}</span><div>${esc(c.Title)}</div></td><td>${stB(c.State)}</td><td class="small nowrap">${esc((c['Window Start']||'').replace('T',' ').slice(0,16))}<br>${esc((c['Window End']||'').replace('T',' ').slice(0,16))}</td><td class="mono small">${esc(c['Affected Resource IDs'])}</td><td>${esc(c['Suppress Alarms'])}</td><td>${c.Risk?`<span class="b ${c.Risk==='High'?'tag-r':c.Risk==='Medium'?'tag-a':'tag-g'}">${esc(c.Risk)} ${esc(c['Risk Score']||'')}</span>`:'—'}</td><td>${can('Operator','Service Owner')?`<button onclick="chgRisk(${jsArg(c['Change ID'])})">Risk review</button>`:''}</td></tr>`).join('')}</table></div><div id="chg-risk"></div>`}catch(e){if(!stale('chg',n))el.innerHTML=`<div class="banner err">${esc(e.message)}</div>`}}
async function chgRisk(id){const el=document.getElementById('chg-risk');el.innerHTML='<div class="card empty pulse">Running topology risk review…</div>';try{const r=await api('/changes/'+encodeURIComponent(id)+'/risk-review',{method:'POST'});
  el.innerHTML=`<div class="card"><h3>Risk review — ${esc(id)} <span class="r"><span class="b ${r.risk==='High'?'tag-r':r.risk==='Medium'?'tag-a':'tag-g'}">${esc(r.risk)} · ${esc(r.score)}</span></span></h3>${r.conflicts.length?`<div class="banner err">${r.conflicts.map(c=>esc(c.reason)).join('<br>')}</div>`:''}<div class="kv"><div>Recommendation</div><div><b>${esc(r.recommendation)}</b></div><div>Services down</div><div>${r.servicesDown.length} <span class="mono dim small">${esc(r.servicesDown.slice(0,10).join(', '))}</span></div><div>Services at risk</div><div>${r.servicesAtRisk.length}</div><div>Accounts</div><div>${r.accounts.length}${r.publicSafetyAccounts.length?` (<b style="color:var(--red)">${r.publicSafetyAccounts.length} public safety</b>)`:''}</div></div></div>`;loadChgSoon()}catch(e){el.innerHTML=`<div class="banner err">${esc(e.message)}</div>`}}
let _cs;function loadChgSoon(){clearTimeout(_cs);_cs=setTimeout(()=>{const keep=document.getElementById('chg-risk').innerHTML;loadChg().then(()=>{document.getElementById('chg-risk').innerHTML=keep})},400)}

// ───────────────────────── 7. Field queue ─────────────────────────
async function loadField(){const el=document.getElementById('tab-field');const n=ticket('field');const mine=roles().includes('Field Tech')&&!can('Operator');el.innerHTML='<div class="empty pulse">Loading…</div>';try{const d=await api('/work-orders'+(mine?'?mine=1':''));if(stale('field',n))return;
  el.innerHTML=`<div class="h1">Field Work Queue</div><div class="sub">${mine?'Work assigned to you':'All open work orders'} — site access, safety, parts and completion criteria in one place. Dispatch needs NOC approval; completion needs findings + evidence.</div>${d.rows.length?d.rows.map(woCard).join(''):'<div class="card empty">No open work orders.</div>'}`}catch(e){if(!stale('field',n))el.innerHTML=`<div class="banner err">${esc(e.message)}</div>`}}

// ───────────────────────── 8. Executive ─────────────────────────
async function loadExec(){const el=document.getElementById('tab-exec');const n=ticket('exec');el.innerHTML='<div class="empty pulse">Loading…</div>';try{const d=await api('/exec');if(stale('exec',n))return;const k=d.kpis;
  const bars=(obj,val,fmtv,color)=>{const e=Object.entries(obj);const mx=Math.max(...e.map(([,v])=>val(v)),1);return e.sort((a,b)=>val(b[1])-val(a[1])).map(([l,v])=>`<div class="hbar"><div class="lb">${esc(l)}</div><div class="tr"><div class="fl" style="width:${val(v)/mx*100}%;background:${color}"></div></div><div class="vv">${fmtv(v)}</div></div>`).join('')};
  const tmax=Math.max(...d.timeline.map(t=>t.minutes),1);
  el.innerHTML=`<div class="h1">Executive Reliability Dashboard</div><div class="sub">Reliability, customer impact and operational performance — ${esc(ME.tenant)} · MTTR measured to <b>verified customer-service recovery</b>, not link-up.</div>
  <div class="kpis"><div class="kpi" style="border-left-color:var(--red)"><div class="l">Open P1</div><div class="v">${k.openP1}</div><div class="s">${k.openIncidents} open total</div></div>
   <div class="kpi" style="border-left-color:var(--blue)"><div class="l">MTTA</div><div class="v">${k.mttaMin??'—'}<span class="small"> min</span></div><div class="s">detect → acknowledge</div></div>
   <div class="kpi" style="border-left-color:var(--cyan)"><div class="l">MTTR (verified)</div><div class="v">${k.mttrMin!=null?Math.round(k.mttrMin/6)/10:'—'}<span class="small"> h</span></div><div class="s">detect → service verified</div></div>
   <div class="kpi" style="border-left-color:var(--amber)"><div class="l">Customer impact</div><div class="v">${n0(k.customerImpactHours)}<span class="small"> acct-h</span></div><div class="s">accounts × hours</div></div>
   <div class="kpi" style="border-left-color:var(--purple)"><div class="l">SLA exposure (open)</div><div class="v">${fmt$(k.slaExposureOpenUsd)}</div></div>
   <div class="kpi" style="border-left-color:var(--green)"><div class="l">Verified closures</div><div class="v">${k.verifiedClosures}/${k.incidents90d}</div><div class="s">closed only after verification</div></div></div>
  <div class="grid g3"><div class="card"><h3>By market — incidents</h3>${bars(d.byMarket,v=>v.incidents,v=>v.incidents+' ('+v.p1+' P1)','#4C8DFF')}</div><div class="card"><h3>By market — customer-minutes</h3>${bars(d.byMarket,v=>v.minutes*Math.max(v.customers,1),v=>n0(Math.round(v.minutes*Math.max(v.customers,1))),'#F2A93B')}</div><div class="card"><h3>By root-cause resource type</h3>${bars(d.byCause,v=>v,v=>v,'#A78BFA')}</div></div>
  <div class="grid g-side2"><div class="card"><h3>Incident history (duration to verified recovery)</h3>${d.timeline.map(t=>`<div class="hbar" style="cursor:pointer" onclick="openInc(${jsArg(t.id)})"><div class="lb" title="${esc(t.title)}">${esc(t.at.slice(0,10))} ${esc(t.priority)}</div><div class="tr"><div class="fl" style="width:${t.minutes/tmax*100}%;background:${t.priority==='P1'?'#FF5A5F':t.priority==='P2'?'#F2A93B':'#4C8DFF'}"></div></div><div class="vv">${t.minutes<120?t.minutes+'m':Math.round(t.minutes/60)+'h'} · ${t.customers}c</div></div>`).join('')}</div>
  <div class="card"><h3>Recurring failure points</h3>${d.recurring.length?d.recurring.map(r=>`<div class="small" style="margin:4px 0"><span class="mono">${esc(r.resource)}</span> — <b>${r.incidents}</b> incidents</div>`).join(''):'<div class="dim">none</div>'}<h3 style="margin-top:14px">Priority mix</h3>${bars(d.byPriority,v=>v,v=>v,'#27C4D8')}</div></div>`}catch(e){if(!stale('exec',n))el.innerHTML=`<div class="banner err">${esc(e.message)}</div>`}}

// ───────────────────────── boot ─────────────────────────
(function(){const s=sessionStorage.getItem('kinetic_session');if(s){try{const j=JSON.parse(s);if(j.auth){API.auth=j.auth;enterApp();return}}catch(e){}}document.getElementById('login-screen').style.display='flex'})();
</script>
